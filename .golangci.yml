version: "2"

linters:
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused
  settings:
    staticcheck:
      checks:
        - all
        - "-QF1008"
        - "-ST1000"
        - "-ST1020"
        - "-ST1021"
  exclusions:
    generated: lax
    rules:
      - path: _test\.go
        linters:
          - errcheck
